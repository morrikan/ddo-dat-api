name: ddomcp
services:
  ddodatapi:
    image: ddodatapi
    ports: 
      - 8080:8080
    volumes:
      - "${DDO_INSTALL_PATH}:/data"
    restart: unless-stopped

  mcp-server:
    image: ckanthony/openapi-mcp:latest
    ports:
      - 8081:8081
    command: >
      --spec http://ddodatapi:8080/swagger/v1/swagger.json
      --port 8081 # The port the app listens on inside the container
    restart: unless-stopped 